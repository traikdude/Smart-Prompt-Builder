<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elite Multi-Channel Architect</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* 🌈 Prismatic Palette — Vibrant & Playful */
        --pink: #FF6B9D;
        --coral: #FF8E53;
        --purple: #A855F7;
        --cyan: #22D3EE;
        --emerald: #34D399;
        --amber: #FBBF24;
        --blue: #6366F1;
        --rose: #FB7185;
        
        --bg-color: #0A0A12;
        --surface: rgba(15,15,25,0.75);
        --text-color: #E2E8F0;
        --text-muted: #94A3B8;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        overflow-x: hidden;
        color: var(--text-color);
        background-image:
          radial-gradient(circle at 10% 20%, rgba(168,85,247,0.08), transparent 30%),
          radial-gradient(circle at 90% 80%, rgba(255,107,157,0.06), transparent 30%),
          radial-gradient(circle at 50% 50%, rgba(34,211,238,0.04), transparent 40%);
      }

      /* 🌈 Living Background Orbs */
      .blob-cont {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: -1; overflow: hidden; pointer-events: none;
      }
      .blob {
        position: absolute; border-radius: 50%;
        filter: blur(90px); opacity: 0.2;
        animation: float 20s infinite alternate cubic-bezier(0.4,0,0.2,1);
      }

      .blob-1 {
        top: -15%; left: -10%;
        width: 55vw; height: 55vw;
        background: linear-gradient(135deg, var(--pink), var(--coral));
        animation-duration: 28s;
      }
      .blob-2 {
        bottom: -15%; right: -12%;
        width: 45vw; height: 45vw;
        background: linear-gradient(135deg, var(--purple), var(--blue));
        animation-duration: 32s;
        animation-direction: alternate-reverse;
      }
      .blob-3 {
        bottom: 15%; left: 15%;
        width: 35vw; height: 35vw;
        background: linear-gradient(135deg, var(--cyan), var(--emerald));
        animation-duration: 24s; opacity: 0.15;
      }

      @keyframes float {
        0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
        100% { transform: translate(40px, 60px) scale(1.15) rotate(5deg); }
      }

      /* 🎨 Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 4px; }
      ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.35); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(168,85,247,0.7); }
      
      .hide-scrollbar::-webkit-scrollbar { display: none; }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fadeInUp 0.45s ease-out forwards; }

      /* ✨ Rainbow shimmer on hover */
      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes rainbowBorder {
        0%   { border-color: var(--pink); box-shadow: 0 0 12px rgba(255,107,157,0.25); }
        25%  { border-color: var(--amber); box-shadow: 0 0 12px rgba(251,191,36,0.25); }
        50%  { border-color: var(--cyan); box-shadow: 0 0 12px rgba(34,211,238,0.25); }
        75%  { border-color: var(--emerald); box-shadow: 0 0 12px rgba(52,211,153,0.25); }
        100% { border-color: var(--purple); box-shadow: 0 0 12px rgba(168,85,247,0.25); }
      }
      @keyframes gradientShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .btn-joyful {
        background: linear-gradient(135deg, var(--pink), var(--coral), var(--purple));
        background-size: 300% 300%;
        animation: gradientShift 4s ease infinite;
        border: none;
        color: #FFF;
        font-weight: 700;
        text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        box-shadow: 0 4px 20px rgba(255,107,157,0.35);
        transition: all 0.25s ease-out;
      }
      .btn-joyful:hover {
        box-shadow: 0 6px 30px rgba(255,107,157,0.5), 0 0 15px rgba(168,85,247,0.3);
        transform: translateY(-2px) scale(1.01);
      }
      .btn-joyful:active { transform: translateY(0) scale(0.98); }

      /* Glass panels with subtle rainbow top accent */
      .glass-panel {
        background: var(--surface);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      }

      /* 🏷️ Category color system */
      .cat-communication { --cat: var(--pink); }
      .cat-technical     { --cat: var(--cyan); }
      .cat-creative      { --cat: var(--amber); }
      .cat-analysis      { --cat: var(--emerald); }
      .cat-development   { --cat: var(--blue); }
      .cat-custom        { --cat: var(--purple); }

      /* Animated top rainbow bar */
      .rainbow-bar {
        height: 3px;
        background: linear-gradient(90deg, var(--pink), var(--coral), var(--amber), var(--emerald), var(--cyan), var(--blue), var(--purple), var(--pink));
        background-size: 400% 100%;
        animation: gradientShift 6s linear infinite;
      }

      /* Input glow effect */
      textarea:focus, select:focus, input:focus {
        box-shadow: 0 0 0 2px rgba(168,85,247,0.25), 0 0 15px rgba(168,85,247,0.1) !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?bundle",
    "react-syntax-highlighter": "https://esm.sh/react-syntax-highlighter@15.5.0?bundle",
    "react-syntax-highlighter/dist/esm/styles/prism": "https://esm.sh/react-syntax-highlighter@15.5.0/dist/esm/styles/prism?bundle",
    "react-syntax-highlighter/": "https://esm.sh/react-syntax-highlighter@^16.1.0/",
    "canvas-confetti": "https://esm.sh/canvas-confetti@1.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
  <body>
    <div class="blob-cont">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
