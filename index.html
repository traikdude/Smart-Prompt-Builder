<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elite Multi-Channel Architect</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* 🌌 Elite Architect Palette */
        --primary: #00F0FF;
        --primary-light: #80f8ff;
        --primary-dark: #0099a3;
        --secondary: #9D4EDD;
        --accent: #E0A96D;
        
        --bg-color: #05050A;
        --text-color: #E2E8F0;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        overflow-x: hidden;
        color: var(--text-color);
        background-image: 
          radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
          radial-gradient(circle at 85% 30%, rgba(157, 78, 221, 0.05), transparent 25%);
      }

      /* 🫧 Holographic Background Orbs */
      .blob-cont {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }
      
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.15;
        animation: float 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
      }

      .blob-1 {
        top: -10%;
        left: -10%;
        width: 50vw;
        height: 50vw;
        background: var(--primary);
        animation-duration: 25s;
      }
      
      .blob-2 {
        bottom: -10%;
        right: -10%;
        width: 40vw;
        height: 40vw;
        background: var(--secondary);
        animation-duration: 30s;
        animation-direction: alternate-reverse;
      }

      .blob-3 {
        bottom: 20%;
        left: 20%;
        width: 30vw;
        height: 30vw;
        background: #FF0055;
        animation-duration: 22s;
        opacity: 0.1;
      }

      @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 50px) scale(1.1); }
      }

      /* Custom scrollbar */
      textarea::-webkit-scrollbar, pre::-webkit-scrollbar, div::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      textarea::-webkit-scrollbar-track, pre::-webkit-scrollbar-track, div::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.02); 
        border-radius: 4px;
      }
      textarea::-webkit-scrollbar-thumb, pre::-webkit-scrollbar-thumb, div::-webkit-scrollbar-thumb {
        background: rgba(0, 240, 255, 0.3); 
        border-radius: 4px;
      }
      textarea::-webkit-scrollbar-thumb:hover, pre::-webkit-scrollbar-thumb:hover, div::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 240, 255, 0.6); 
      }
      
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.4s ease-out forwards;
      }

      /* ✨ Cyber Button Effect */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      .btn-joyful {
        background: linear-gradient(90deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        background-size: 200% 100%;
        border: 1px solid rgba(0, 240, 255, 0.3);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.1), inset 0 0 10px rgba(0, 240, 255, 0.05);
        color: var(--primary);
        transition: all 0.2s ease-out;
      }
      .btn-joyful:hover {
        background-position: 100% 0;
        border-color: rgba(0, 240, 255, 0.8);
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.1);
        text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
      }
      .btn-joyful:active {
        transform: scale(0.98);
      }

      /* Tech Glass Panels */
      .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?bundle",
    "react-syntax-highlighter": "https://esm.sh/react-syntax-highlighter@15.5.0?bundle",
    "react-syntax-highlighter/dist/esm/styles/prism": "https://esm.sh/react-syntax-highlighter@15.5.0/dist/esm/styles/prism?bundle",
    "react-syntax-highlighter/": "https://esm.sh/react-syntax-highlighter@^16.1.0/",
    "canvas-confetti": "https://esm.sh/canvas-confetti@1.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
  <body>
    <div class="blob-cont">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
