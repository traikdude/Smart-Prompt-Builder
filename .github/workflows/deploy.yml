name: Deploy to Google Apps Script

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: 🛡️ Quality & Build Verification
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint fastapi uvicorn pydantic google-genai

    - name: 🔍 Run Pylint (Backend)
      run: |
        # Enforce the 10.00/10 mandate
        pylint --fail-under=10.00 backend/main.py

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install NPM dependencies
      run: npm install

    - name: 🏗️ Verify Frontend Build
      run: npm run build

  deploy:
    name: 🚀 Deploy to GAS
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies & Build
      run: |
        npm install
        npm run build

    - name: 📦 Install Clasp
      run: npm install -g @google/clasp
      
    - name: 🔐 Configure Clasp credentials
      run: |
        echo "$CLASPRC_JSON" > ~/.clasprc.json
      env:
        CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        
    - name: 🚀 Push to Apps Script
      run: clasp push --force
      
    - name: 🌐 Deploy as Web App
      run: |
        DEPLOYMENT_ID="AKfycbwcP0UgfCiDq6CH0gPWroJexCyKcEjLy-kb6FWa1VOYFHzajgjF3gc-cOqv87Til4y1tA"
        clasp deploy --deploymentId $DEPLOYMENT_ID --description "Automated build $(date +'%Y-%m-%d %H:%M:%S')"
